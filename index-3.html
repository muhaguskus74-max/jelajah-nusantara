<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jelajah Nusantara</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{background:linear-gradient(135deg,#e3f2fd,#bbdefb);font-family:Arial,sans-serif;padding:40px 20px;min-height:100vh;display:flex;justify-content:center;align-items:center}
        .container{background:#fff;border-radius:20px;padding:40px 30px;max-width:450px;width:100%;text-align:center;box-shadow:0 6px 25px rgba(0,0,0,.1);animation:muncul .7s ease-out}
        @keyframes muncul{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
        h1{color:#1565c0;font-size:28px;margin-bottom:10px}
        h2{color:#424242;font-size:18px;margin-bottom:30px;font-weight:normal}
        .logo{font-size:60px;margin-bottom:20px}
        .btn{background:linear-gradient(135deg,#42a5f5,#1976d2);color:#fff;padding:16px 25px;font-size:18px;font-weight:bold;border:none;border-radius:12px;cursor:pointer;width:100%;margin:10px 0;transition:transform .2s}
        .btn:active{transform:scale(.97)}
        .btn-secondary{background:#f0f0f0;color:#333;font-weight:normal}
        .info{margin-top:30px;font-size:14px;color:#757575;line-height:1.6}
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">🇮🇩</div>
        <h1>JELAJAH NUSANTARA</h1>
        <h2>Letak & Kondisi Wilayah Indonesia<br>IPS Terpadu — Kelas VII</h2>
        <button class="btn" onclick="location.href='menu.html'">▶️ MULAI BELAJAR</button>
        <button class="btn btn-secondary" onclick="tentang()">ℹ️ Tentang Media</button>
        <div class="info">Dibuat oleh: Muh. Agus Kusriyanto, SE<br>SMP Negeri 2 Sayung<br>Kurikulum Merdeka — 2026/2027</div>
    </div>
    <script>
        function tentang(){alert("Media Pembelajaran IPS Terpadu\nMateri: Letak Wilayah Indonesia\nKelas VII\nDibuat oleh: Muh. Agus Kusriyanto, SE")}
    </script>
</body>
</html>
